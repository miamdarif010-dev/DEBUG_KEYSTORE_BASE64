// Logged out: the cart stays in this browser.
// Logged in: the cart is saved in users/{uid}/cart, the same place the app uses,
// so the app and the website always show the same cart for the same account.
function localCart() { try { return JSON.parse(localStorage.getItem("bn_cart") || "[]"); } catch (e) { return []; } }
function saveLocal(c) { try { localStorage.setItem("bn_cart", JSON.stringify(c)); } catch (e) {} }
let cartMem = localCart(), cartUnsub = null;
function getCart() { return cartMem; }
function updateCartCount() { const n = cartMem.reduce((s, i) => s + i.qty, 0); const el = $("cartCnt"); el.textContent = n; el.hidden = n === 0; }
// Same document id the app uses: a different size or color is a separate line.
function cartDocId(i) {
  const c = (i.color || "").trim(), z = (i.size || "").trim();
  return (!c && !z) ? i.id : (i.id + "__" + c + "__" + z).replace(/\//g, "-");
}
const cartCol = () => collection(db, "users", user.uid, "cart");
function fromCartDoc(d) {
  const x = d.data() || {};
  return {
    _d: d.id, id: String(x.productId || d.id), kind: x.isResellerProduct === true ? "r" : "p",
    name: String(x.name ?? x.productName ?? ""), imageUrl: String(x.imageUrl || ""),
    price: Number(x.price ?? x.sellingPrice) || 0, qty: Math.max(1, Number(x.quantity) || 1),
    size: String(x.size ?? x.selectedSize ?? "").trim(), color: String(x.color ?? x.selectedColor ?? "").trim()
  };
}
function subscribeCart() {
  if (cartUnsub) cartUnsub();
  return new Promise((resolve) => {
    let first = true;
    const t = setTimeout(resolve, 4000);
    cartUnsub = onSnapshot(cartCol(), (snap) => {
      cartMem = snap.docs.map(fromCartDoc); updateCartCount();
      if (first) { first = false; clearTimeout(t); resolve(); }
      else if (location.hash === "#/cart") viewCart();
    }, (e) => { console.warn("cart", e); clearTimeout(t); resolve(); });
  });
}
async function addToCart(item, qty) {
  const size = item.size || "", color = item.color || "";
  if (!user) {
    const cart = localCart();
    const f = cart.find(i => i.id === item.id && i.kind === item.kind && (i.size || "") === size && (i.color || "") === color);
    if (f) f.qty = Math.min(100, f.qty + qty);
    else cart.push({ id: item.id, kind: item.kind, name: item.name, imageUrl: item.imageUrl, price: item.price, qty, size, color });
    saveLocal(cart); cartMem = cart; updateCartCount(); return;
  }
  const ref = doc(db, "users", user.uid, "cart", cartDocId(item));
  const snap = await getDoc(ref);
  if (snap.exists()) {
    await updateDoc(ref, { quantity: Math.min(100, (Number(snap.data().quantity) || 1) + qty), name: item.name, price: item.price, imageUrl: item.imageUrl || "" });
  } else {
    await setDoc(ref, {
      productId: item.id, name: item.name, price: item.price, imageUrl: item.imageUrl || "", quantity: qty,
      addedAt: serverTimestamp(), color, size, variant: "",
      isResellerProduct: item.kind === "r", entrepreneurUid: "", sellerId: "",
      supplierProductId: item.kind === "r" ? "" : item.id, supplierPrice: null, resellerProfit: null
    });
  }
}
async function cartSetQty(it, q) {
  it.qty = q;
  if (!user) { saveLocal(cartMem); updateCartCount(); return; }
  await updateDoc(doc(db, "users", user.uid, "cart", it._d || cartDocId(it)), { quantity: q });
}
async function cartRemove(it) {
  cartMem = cartMem.filter(x => x !== it);
  if (!user) { saveLocal(cartMem); updateCartCount(); return; }
  await deleteDoc(doc(db, "users", user.uid, "cart", it._d || cartDocId(it)));
}
async function clearCart() {
  if (!user) { cartMem = []; saveLocal([]); updateCartCount(); return; }
  const snap = await getDocs(cartCol());
  await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
  cartMem = []; updateCartCount();
}

getRedirectResult(auth).catch((e) => { try { sessionStorage.setItem("bn_autherr", errText(e)); } catch (x) {} });
onAuthStateChanged(auth, async (u) => {
  user = u; authReady = true;
  $("uTxt").textContent = u ? "অ্যাকাউন্ট" : "লগইন";
  if (u) {
    needCode = false;
    try {
      const ref = doc(db, "users", u.uid);
      const snap = await getDoc(ref);
      let nm = u.displayName || "";
      try { nm = nm || sessionStorage.getItem("bn_signup_name") || ""; sessionStorage.removeItem("bn_signup_name"); } catch (x) {}
      const photo = u.photoURL || "";
      let ud = {};
      if (!snap.exists()) {
        // New account (Google details are taken from the Google account)
        await setDoc(ref, { uid: u.uid, name: nm, email: u.email || "", phone: "", profileImageUrl: photo, sellerStatus: "none", entrepreneurStatus: "none", createdAt: serverTimestamp(), updatedAt: serverTimestamp() }, { merge: true });
      } else {
        ud = snap.data() || {};
        const patch = { updatedAt: serverTimestamp() };
        if (u.email && ud.email !== u.email) patch.email = u.email;
        if (!ud.name && nm) patch.name = nm;
        if (!ud.profileImageUrl && photo) patch.profileImageUrl = photo;
        await updateDoc(ref, patch);
      }
      // Email code is only for brand-new email + password accounts
      const usesPassword = u.providerData.some(p => p.providerId === "password");
      const created = u.metadata && u.metadata.creationTime ? Date.parse(u.metadata.creationTime) : 0;
      needCode = usesPassword && created >= CODE_AFTER && ud.emailCodeVerified !== true;
    } catch (e) { console.warn("user doc", e); }
    // Items added before login move into the account cart (same cart as the app).
    const pending = localCart();
    if (pending.length) {
      for (const it of pending) { try { await addToCart(it, it.qty); } catch (e) { console.warn("merge cart", e); } }
      saveLocal([]);
    }
    await subscribeCart();
  } else {
    needCode = false;
    if (cartUnsub) { cartUnsub(); cartUnsub = null; }
    cartMem = localCart(); updateCartCount();
  }
  route();
});

const listOf = (raw) => Array.isArray(raw)
  ? raw.map(x => String(x ?? "").trim()).filter(Boolean)
  : (typeof raw === "string" ? raw.split(",").map(x => x.trim()).filter(Boolean) : []);

async function viewProduct(kind, id) {
  page(`<div class="msg">লোড হচ্ছে...</div>`);
  let l;
  try {
    const r = kind === "r" ? await call("getResellerListing", { listingId: id }) : await call("getProductListing", { productId: id });
    l = r.listing;
  } catch (e) { page(`<div class="box" style="margin-top:14px"><div class="err">${esc(errText(e))}</div><a class="btn out" href="#/">← হোমে ফিরুন</a></div>`); return; }

  const images = (l.images && l.images.length ? l.images : [l.imageUrl]).map(safeImg).filter(Boolean);

  // sizes and colors the seller offers
  const sizes = [...new Set(listOf(l.sizes).map(s => s.toUpperCase()))];
  const colors = (Array.isArray(l.colors) ? l.colors : [])
    .filter(c => c && typeof c === "object")
    .map(c => {
      let hex = String(c.hex || "").trim();
      hex = /^#?[0-9a-fA-F]{6}$/.test(hex) ? (hex[0] === "#" ? hex : "#" + hex) : "#9e9e9e";
      return { name: String(c.name || c.hex || "").trim(), hex, images: listOf(c.images).map(safeImg).filter(Boolean) };
    })
    .filter(c => c.name);

  let qty = 1, selColor = null, selSize = null, mainIdx = 0;
  const curImages = () => {
    const c = selColor !== null ? colors[selColor] : null;
    return (c && c.images.length) ? c.images : images;
  };
  const makeItem = () => ({
    id, kind, name: l.name, price: l.price,
    imageUrl: curImages()[0] || images[0] || "",
    size: selSize || "", color: selColor !== null ? colors[selColor].name : ""
  });
  const missing = () => {
    if (colors.length && selColor === null) return "আগে কালার বাছাই করুন।";
    if (sizes.length && !selSize) return "আগে সাইজ বাছাই করুন।";
    return "";
  };
  const off = l.originalPrice && l.originalPrice > l.price ? Math.round((1 - l.price / l.originalPrice) * 100) : 0;
  page(`<div style="padding-top:10px"><a href="#/" class="muted">← সব পণ্য</a></div>
  <div class="box" style="margin-top:8px"><div class="pgrid">
    <div id="gal"></div>
    <div><span class="st">✨ আপনার পছন্দের পণ্য</span><h1 class="pname" style="margin-top:10px">${esc(l.name)}</h1>
      <div class="pprice">${off ? `<s>${money(l.originalPrice)}</s>` : ""}${money(l.price)}${off ? ` <span class="off" style="position:static;display:inline-block;vertical-align:middle">-${off}%</span>` : ""}</div>
      <div class="chips"><span class="chip">✔ মানসম্মত পণ্য</span><span class="chip">♡ পছন্দের কালেকশন</span><span class="chip">★ BuyNova</span>${l.category ? `<span class="chip">${esc(l.category)}</span>` : ""}</div>
      <div id="opts"></div>
      <div class="qty"><button id="mi">−</button><span id="qv">1</span><button id="pl">+</button></div>
      <div class="sum t" style="margin-top:0"><span>মোট (<i id="qn" style="font-style:normal">1</i>টি)</span><span id="tot">${money(l.price)}</span></div>
      <div id="pmsg"></div>
      <div class="row"><button class="btn out" id="addC">🛒 কার্টে রাখুন</button><button class="btn" id="buyN">এখনই কিনুন</button></div>
      <div class="row"><a class="btn out" href="buynova://${kind}/${encodeURIComponent(id)}">📱 অ্যাপে খুলুন</a><button class="btn out" id="cpy">🔗 লিংক কপি</button></div></div></div>
    ${l.description ? `<h3 style="margin-top:16px">পণ্যের বিবরণ</h3><div class="pdesc">${esc(l.description)}</div>` : ""}</div>`);

  const drawGal = () => {
    const imgs = curImages();
    if (mainIdx >= imgs.length) mainIdx = 0;
    $("gal").innerHTML = `<div class="pimg">${imgs[mainIdx] ? `<img src="${esc(imgs[mainIdx])}" alt="">` : ""}</div>` +
      (imgs.length > 1 ? `<div class="thumbs">${imgs.map((u, n) => `<img src="${esc(u)}" data-n="${n}" class="${n === mainIdx ? "on" : ""}" alt="">`).join("")}</div>` : "");
    $("gal").querySelectorAll(".thumbs img").forEach(t => t.onclick = () => { mainIdx = +t.dataset.n; drawGal(); });
  };
  const drawOpts = () => {
    let h = "";
    if (colors.length) {
      h += `<div class="ol"><b>কালার</b>${selColor !== null ? `<span class="sel">${esc(colors[selColor].name)}</span>` : `<i class="req">বাছাই করুন</i>`}</div>
        <div class="cw">${colors.map((c, n) => `<button type="button" class="cd ${n === selColor ? "on" : ""}" data-co="${n}" title="${esc(c.name)}" style="background:${c.hex}"></button>`).join("")}</div>`;
    }
    if (sizes.length) {
      h += `<div class="ol"><b>সাইজ</b>${selSize ? `<span class="sel">${esc(selSize)}</span>` : `<i class="req">বাছাই করুন</i>`}</div>
        <div class="sw">${sizes.map(s => `<button type="button" class="sz ${s === selSize ? "on" : ""}" data-sz="${esc(s)}">${esc(s)}</button>`).join("")}</div>`;
    }
    $("opts").innerHTML = h;
    $("opts").querySelectorAll("[data-co]").forEach(b => b.onclick = () => { selColor = +b.dataset.co; mainIdx = 0; $("pmsg").innerHTML = ""; drawGal(); drawOpts(); });
    $("opts").querySelectorAll("[data-sz]").forEach(b => b.onclick = () => { selSize = b.dataset.sz; $("pmsg").innerHTML = ""; drawOpts(); });
  };
  drawGal(); drawOpts();

  const upd = () => { $("qv").textContent = qty; $("qn").textContent = qty; $("tot").textContent = money(l.price * qty); };
  const blocked = () => {
    const m = missing();
    if (!m) return false;
    $("pmsg").innerHTML = `<div class="err">${m}</div>`;
    $("opts").scrollIntoView({ behavior: "smooth", block: "center" });
    return true;
  };
  $("mi").onclick = () => { qty = Math.max(1, qty - 1); upd(); };
  $("pl").onclick = () => { qty = Math.min(100, qty + 1); upd(); };
  $("addC").onclick = async () => {
    if (blocked()) return;
    try {
      await addToCart(makeItem(), qty);
      $("pmsg").innerHTML = `<div class="ok">কার্টে যোগ হয়েছে। <a href="#/cart" style="text-decoration:underline">কার্ট দেখুন</a></div>`;
    } catch (e) { $("pmsg").innerHTML = `<div class="err">কার্টে যোগ করা যায়নি: ${esc(errText(e))}</div>`; }
  };
  $("buyN").onclick = async () => {
    if (blocked()) return;
    try { await addToCart(makeItem(), qty); location.hash = "#/checkout"; }
    catch (e) { $("pmsg").innerHTML = `<div class="err">কার্টে যোগ করা যায়নি: ${esc(errText(e))}</div>`; }
  };
  $("cpy").onclick = () => {
    const link = location.origin + "/" + kind + "/" + encodeURIComponent(id);
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast("লিংক কপি হয়েছে ✅")).catch(() => prompt("লিংক কপি করুন:", link));
  };
}

    <div class="sum t"><span>সাবটোটাল</span><span>${money(sub)}</span></div>
    <div class="muted">ডেলিভারি চার্জ ও কুপন চেকআউটে হিসাব হবে।</div><a class="btn" href="#/checkout">চেকআউট করুন</a></div>`);
  $app.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => { const it = getCart()[+b.dataset.n]; if (!it) return; try { await cartSetQty(it, Math.min(100, Math.max(1, it.qty + (+b.dataset.d)))); } catch (e) { toast("আপডেট করা যায়নি"); } viewCart(); });
  $app.querySelectorAll("[data-r]").forEach(b => b.onclick = async () => { const it = getCart()[+b.dataset.r]; if (!it) return; try { await cartRemove(it); } catch (e) { toast("মোছা যায়নি"); } viewCart(); });
}

// ---------- login ----------
function viewLogin(mode) {
  if (user) { const back = sessionStorage.getItem("bn_back") || "#/orders"; sessionStorage.removeItem("bn_back"); location.hash = back; return; }
  const su = mode === "signup";
  page(`<div class="box" style="margin:14px auto;max-width:420px"><h2>${su ? "নতুন অ্যাকাউন্ট খুলুন" : "লগইন"}</h2>
    <button class="btn out" id="gBtn" style="margin-top:0">Google দিয়ে সরাসরি চালিয়ে যান</button>
    <div class="muted" style="text-align:center;margin-top:6px">Google দিয়ে ঢুকলে আলাদা অ্যাকাউন্ট খোলা লাগে না। আপনার নাম, ইমেইল ও ছবি Google থেকে নিজেই সেভ হবে।</div>
    <div class="or">অথবা ইমেইল দিয়ে</div>
    ${su ? `<label class="f">আপনার নাম</label><input class="t" id="nm" autocomplete="name">` : ""}
    <label class="f">ইমেইল</label><input class="t" id="em" type="email" autocomplete="email">
    <label class="f">পাসওয়ার্ড${su ? " (কমপক্ষে ৬ অক্ষর)" : ""}</label><input class="t" id="pw" type="password" autocomplete="${su ? "new-password" : "current-password"}">
    <div id="lerr"></div>
    <button class="btn" id="mainBtn">${su ? "অ্যাকাউন্ট খুলুন" : "লগইন"}</button>
    ${su ? `<div class="muted" style="margin-top:8px">অ্যাকাউন্ট খুললে আপনার ইমেইলে একটি ৬ সংখ্যার কোড যাবে। কোড দিলে অ্যাকাউন্ট চালু হবে।</div>` : ""}
    <div class="or">${su ? "আগে থেকেই অ্যাকাউন্ট আছে?" : "নতুন ইউজার?"} <a href="#/login${su ? "" : "/signup"}" style="color:var(--brand);font-weight:700">${su ? "লগইন করুন" : "অ্যাকাউন্ট খুলুন"}</a></div></div>`);
  const show = (e) => { $("lerr").innerHTML = `<div class="err">${esc(errText(e))}</div>`; };
  try { const pe = sessionStorage.getItem("bn_autherr"); if (pe) { sessionStorage.removeItem("bn_autherr"); $("lerr").innerHTML = `<div class="err">${esc(pe)}</div>`; } } catch (x) {}
  const done = () => { const back = sessionStorage.getItem("bn_back") || "#/orders"; sessionStorage.removeItem("bn_back"); location.hash = back; };
  $("gBtn").onclick = async () => {
    $("lerr").innerHTML = "";
    if (IN_APP) { $("lerr").innerHTML = `<div class="err">Google এই ব্রাউজারে লগইন করতে দেয় না। ⋮ মেনু থেকে Chrome-এ খুলুন, অথবা নিচে ইমেইল দিয়ে লগইন করুন।</div>`; return; }
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    try {
      await signInWithPopup(auth, provider); done();
    } catch (e) {
      const fallback = ["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/web-storage-unsupported"];
      if (fallback.indexOf(e.code) !== -1) {
        try { await signInWithRedirect(auth, provider); return; } catch (e2) { show(e2); return; }
      }
      if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
      show(e);
    }
  };
  $("mainBtn").onclick = () => {
    $("lerr").innerHTML = "";
    const email = $("em").value.trim(), pass = $("pw").value;
    if (!su) { signInWithEmailAndPassword(auth, email, pass).then(done).catch(show); return; }
    const name = $("nm").value.trim();
    if (name.length < 2) { $("lerr").innerHTML = `<div class="err">আপনার নাম দিন।</div>`; return; }
    if (pass.length < 6) { $("lerr").innerHTML = `<div class="err">পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।</div>`; return; }
    try { sessionStorage.setItem("bn_signup_name", name); } catch (x) {}
    createUserWithEmailAndPassword(auth, email, pass).then(done).catch(show);
  };
}

// ---------- email code (new email + password accounts) ----------
async function viewVerify() {
  page(`<div class="box" style="margin:14px auto;max-width:420px"><h2>ইমেইল যাচাই করুন</h2>
    <p class="muted" id="vinfo">কোড পাঠানো হচ্ছে...</p>
    <input class="t" id="vc" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="৬ সংখ্যার কোড" style="text-align:center;font-size:24px;letter-spacing:8px">
    <div id="verr"></div>
    <button class="btn" id="vBtn">যাচাই করুন</button>
    <button class="btn out" id="rBtn" disabled>আবার কোড পাঠান</button>
    <button class="btn out" id="oBtn">অন্য অ্যাকাউন্টে লগইন করুন</button></div>`);
  let timer = null;
  const countdown = (sec) => {
    clearInterval(timer);
    const btn = $("rBtn"); if (!btn) return;
    const tick = () => { const b = $("rBtn"); if (!b) { clearInterval(timer); return; } if (sec <= 0) { clearInterval(timer); b.disabled = false; b.textContent = "আবার কোড পাঠান"; return; } b.disabled = true; b.textContent = "নতুন কোড " + sec + " সেকেন্ড পর"; sec--; };
    tick(); timer = setInterval(tick, 1000);
  };
  const send = async () => {
    $("verr").innerHTML = "";
    try {
      const r = await call("sendLoginCode");
      if (r.alreadyVerified) { needCode = false; route(); return; }
      $("vinfo").textContent = (r.email || user.email) + " ঠিকানায় ৬ সংখ্যার একটি কোড পাঠানো হয়েছে। কোডটি ১০ মিনিট চলবে।";
      countdown(r.resendAfterSeconds || 60);
    } catch (e) { $("vinfo").textContent = (user.email || "") + " ঠিকানায় কোড পাঠানো যায়নি।"; $("verr").innerHTML = `<div class="err">${esc(errText(e))}</div>`; countdown(30); }
  };
  $("rBtn").onclick = send;
  $("vBtn").onclick = async () => {
    const code = $("vc").value.trim();
    if (!/^\d{6}$/.test(code)) { $("verr").innerHTML = `<div class="err">৬ সংখ্যার কোড দিন।</div>`; return; }
    const btn = $("vBtn"); btn.disabled = true; $("verr").innerHTML = "";
    try {
      await call("verifyLoginCode", { code });
      needCode = false; clearInterval(timer);
      const back = sessionStorage.getItem("bn_back") || "#/"; sessionStorage.removeItem("bn_back");
      toast("ইমেইল যাচাই হয়েছে ✅");
      if (location.hash === back) route(); else location.hash = back;
    } catch (e) { $("verr").innerHTML = `<div class="err">${esc(errText(e))}</div>`; btn.disabled = false; }
  };
  $("oBtn").onclick = async () => { clearInterval(timer); await signOut(auth); location.hash = "#/login"; };
  send();
}

// ---------- checkout ----------
async function viewCheckout() {
  const cart = getCart();
  if (!cart.length) { location.hash = "#/cart"; return; }
  if (!user) { sessionStorage.setItem("bn_back", "#/checkout"); location.hash = "#/login"; return; }
  page(`<div class="msg">লোড হচ্ছে...</div>`);
  let addrs = [];
  try { const s = await getDocs(collection(db, "users", user.uid, "addresses")); addrs = s.docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) { console.warn("addresses", e); }
  const sub = cart.reduce((s, i) => s + i.price * i.qty, 0);
  let selAddr = addrs.length ? addrs[0].id : "", pay = "Cash on Delivery";

  const draw = () => {
    page(`<div style="margin-top:14px">
    <div class="box"><h3>ডেলিভারি ঠিকানা</h3>
      ${addrs.map(a => `<label class="opt ${selAddr === a.id ? "on" : ""}"><input type="radio" name="ad" value="${esc(a.id)}" ${selAddr === a.id ? "checked" : ""}>
        <div><b>${esc(a.name)}</b> · ${esc(a.phone)}<br>${esc(a.address || a.addressLine1)}<br><span class="muted">${a.deliveryZone === "inside_dhaka" ? "ঢাকার ভেতরে" : "ঢাকার বাইরে"}</span></div></label>`).join("")}
      <button class="btn out" id="newAd" style="margin-top:4px">+ নতুন ঠিকানা যোগ করুন</button>
      <div id="adForm" hidden>
        <label class="f">নাম</label><input class="t" id="an"><label class="f">ফোন নম্বর</label><input class="t" id="ap" type="tel">
        <label class="f">সম্পূর্ণ ঠিকানা</label><textarea class="t" id="aa" rows="2"></textarea>
        <label class="f">ডেলিভারি এলাকা</label><select class="t" id="az"><option value="inside_dhaka">ঢাকার ভেতরে (৳ 60)</option><option value="outside_dhaka">ঢাকার বাইরে (৳ 120)</option></select>
        <div id="aerr"></div><button class="btn" id="saveAd">ঠিকানা সেভ করুন</button></div></div>
    <div class="box"><h3>পেমেন্ট</h3>
      <label class="opt ${pay === "Cash on Delivery" ? "on" : ""}"><input type="radio" name="py" value="Cash on Delivery" ${pay === "Cash on Delivery" ? "checked" : ""}><div>ক্যাশ অন ডেলিভারি</div></label>
      <label class="opt ${pay === "BuyNova Wallet" ? "on" : ""}"><input type="radio" name="py" value="BuyNova Wallet" ${pay === "BuyNova Wallet" ? "checked" : ""}><div>BuyNova Wallet<div class="muted" id="wb"></div></div></label></div>
    <div class="box"><h3>কুপন</h3><input class="t" id="cp" placeholder="কুপন কোড (থাকলে)"></div>
    <div class="box"><h3>অর্ডার সারাংশ</h3>
      ${cart.map(i => `<div class="sum"><span>${esc(i.name)}${esc(optShort(i))} × ${i.qty}</span><span>${money(i.price * i.qty)}</span></div>`).join("")}
      <div class="sum t"><span>সাবটোটাল</span><span>${money(sub)}</span></div>
      <div class="muted">ডেলিভারি চার্জ ও ডিসকাউন্ট যোগ হয়ে চূড়ান্ত মোট অর্ডারের পর দেখানো হবে।</div>
      <div id="oerr"></div><button class="btn" id="place">অর্ডার করুন</button></div></div>`);

    $app.querySelectorAll('input[name="ad"]').forEach(r => r.onchange = () => { selAddr = r.value; draw(); });
    $app.querySelectorAll('input[name="py"]').forEach(r => r.onchange = () => { pay = r.value; const c = $("cp").value; draw(); $("cp").value = c; });
    if (pay === "BuyNova Wallet") call("getWalletBalance").then(r => { const el = $("wb"); if (el) el.textContent = "ব্যালেন্স: " + money(r.balance); }).catch(() => {});
    $("newAd").onclick = () => { $("adForm").hidden = false; };
    $("saveAd").onclick = async () => {
      const name = $("an").value.trim(), phone = $("ap").value.trim(), address = $("aa").value.trim(), zone = $("az").value;
      if (!name || !phone || !address) { $("aerr").innerHTML = `<div class="err">নাম, ফোন ও ঠিকানা দিন।</div>`; return; }
      try {
        const ref = await addDoc(collection(db, "users", user.uid, "addresses"), { name, phone, address, deliveryZone: zone, createdAt: serverTimestamp() });
        addrs.push({ id: ref.id, name, phone, address, deliveryZone: zone }); selAddr = ref.id; draw();
      } catch (e) { $("aerr").innerHTML = `<div class="err">ঠিকানা সেভ হয়নি: ${esc(errText(e))}</div>`; }
    };
    $("place").onclick = async () => {
      const btn = $("place"), oerr = $("oerr"); oerr.innerHTML = "";
      if (!selAddr) { oerr.innerHTML = `<div class="err">আগে একটি ডেলিভারি ঠিকানা যোগ করুন।</div>`; return; }
      btn.disabled = true; btn.textContent = "অপেক্ষা করুন...";
      let orderId = null;
      try {
        const res = await call("createOrder", {
          items: cart.map(i => ({ productId: i.id, quantity: i.qty, isResellerProduct: i.kind === "r", size: i.size || "", color: i.color || "" })),
          requireOptions: true,
          couponCode: $("cp").value.trim(), paymentMethod: pay, addressId: selAddr
        });
        orderId = res.orderId;
        if (pay === "BuyNova Wallet") {
          try { await call("placeWalletOrder", { orderId }); }
          catch (e) { try { await call("cancelUnpaidOrder", { orderId }); } catch (x) {} throw e; }
        }
        try { await clearCart(); } catch (e) { console.warn('clear cart', e); }
        page(`<div class="box msg" style="margin-top:14px"><h2>✅ অর্ডার সফল হয়েছে</h2>
          <p>মোট: <b>${money(res.total)}</b> (ডেলিভারি ${money(res.deliveryFee)}${res.discount ? `, ডিসকাউন্ট ${money(res.discount)}` : ""})</p>
          <p class="muted">অর্ডার আইডি: ${esc(orderId)}</p><a class="btn" href="#/orders">আমার অর্ডার দেখুন</a><a class="btn out" href="#/">আরও কেনাকাটা</a></div>`);
      } catch (e) { oerr.innerHTML = `<div class="err">${esc(errText(e))}</div>`; btn.disabled = false; btn.textContent = "অর্ডার করুন"; }
    };
  };
  draw();
}

// ---------- orders ----------
async function viewOrders() {
  if (!user) { sessionStorage.setItem("bn_back", "#/orders"); location.hash = "#/login"; return; }
  page(`<div class="msg">লোড হচ্ছে...</div>`);
  let list = [];
  try { const s = await getDocs(query(collection(db, "orders"), where("userId", "==", user.uid))); list = s.docs.map(d => ({ id: d.id, ...d.data() })); }
  catch (e) { page(`<div class="err" style="margin-top:14px">অর্ডার লোড করা যায়নি: ${esc(errText(e))}</div>`); return; }
  list.sort((a, b) => ((b.createdAt && b.createdAt.seconds) || 0) - ((a.createdAt && a.createdAt.seconds) || 0));
  const stBn = { placed: "অর্ডার হয়েছে", confirmed: "কনফার্ম", processing: "প্রসেসিং", shipped: "শিপড", delivered: "ডেলিভারড", cancelled: "বাতিল", returned: "রিটার্ন" };
  page(`<div style="margin-top:14px"><h2>আমার অর্ডার</h2>${list.length ? list.map(o => `<div class="box">
    <div class="sum"><span class="muted">#${esc(o.id)}</span><span class="st">${esc(stBn[o.orderStatus] || o.orderStatus || "")}</span></div>
    ${(o.items || []).map(i => `<div class="sum"><span>${esc(i.name)}${esc(optShort(i))} × ${esc(i.quantity)}</span><span>${money(i.total)}</span></div>`).join("")}
    <div class="sum t"><span>মোট (${esc(o.paymentMethod)})</span><span>${money(o.grandTotal ?? o.total)}</span></div></div>`).join("") : `<div class="box msg">এখনো কোনো অর্ডার নেই।</div>`}</div>`);
}

// ---------- router ----------
function route() {
  if (!authReady) return;
  const parts = (location.hash.replace(/^#\/?/, "") || "").split("/").filter(Boolean);
  window.scrollTo(0, 0);
  const [a, b] = parts;
  if (user && needCode) return viewVerify();
  if (!a) { loadItems().catch(() => {}); return viewHome(); }
  if ((a === "p" || a === "r") && b) return viewProduct(a, decodeURIComponent(b));
  if (a === "cart") return viewCart();
  if (a === "checkout") return viewCheckout();
  if (a === "orders") return viewOrders();
  if (a === "login") return viewLogin(b);
  viewHome();
}
window.addEventListener("hashchange", route);
updateCartCount();
loadItems().catch(() => {});
</script>
