name: buynova
description: BuyNova shopping app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.6.0
  cloud_functions: ^6.0.5

  # Authentication
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1

  # Local storage
  shared_preferences: ^2.5.3

  # Media / Video
  video_player: ^2.9.2
  image_picker: ^1.1.2

  # Image search / image labeling
  google_mlkit_image_labeling: ^0.14.2

  # Network / Sharing
  http: ^1.2.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
