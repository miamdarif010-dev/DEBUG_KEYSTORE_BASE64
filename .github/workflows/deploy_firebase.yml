name: BuyNova Deploy Firebase

# Manual only: GitHub -> Actions -> "BuyNova Deploy Firebase" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "What to deploy (firebase --only value)"
        required: true
        default: "firestore:rules,functions"
        type: choice
        options:
          - "firestore:rules,functions"
          - "firestore:rules"
          - "functions"
          - "hosting"
          - "storage"
          - "firestore:rules,functions,hosting,storage"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        run: npm ci --prefix functions || npm install --prefix functions

      - name: Login to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy
        run: npx -y firebase-tools@latest deploy --only "${{ inputs.targets }}" --project buynova-cc5dd --non-interactive --force
