name: BuyNova Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Restore persistent debug keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Analyze project
        run: flutter analyze

      - name: Build APK (retries on network errors)
        run: |
          ok=0
          for i in 1 2 3; do
            if flutter build apk --release; then
              ok=1
              break
            fi
            echo "Build attempt $i failed. Retrying in 60 seconds..."
            sleep 60
          done
          [ "$ok" = "1" ]

      - name: Signing report (read it on the run Summary page)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          {
            echo "## BuyNova signing report"
            echo ""
            echo "### 1. Certificate the APK was REALLY signed with"
            echo '```'
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA-1|SHA-256" || echo "could not read APK certificate"
            echo '```'
            echo ""
            echo "### 2. Fingerprints of the restored debug keystore"
            echo '```'
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || echo "could not read keystore"
            echo '```'
            echo ""
            echo "### 3. google-services.json"
            echo '```'
            if [ -f android/app/google-services.json ]; then
              echo "file found"
              grep -E '"package_name"|"certificate_hash"|"client_type"' android/app/google-services.json || true
            else
              echo "MISSING android/app/google-services.json"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BuyNova-APK
          path: build/app/outputs/flutter-apk/app-release.apk
